// Keep concurrent agents' emulator installs separate without changing release identity.
// Usage: gradlew -I tools/qa/isolated_app.gradle "-PqaApplicationId=io.github.lrq3000.utterlane.idleqa" assembleDebug assembleDebugAndroidTest
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        def qaId = project.findProperty('qaApplicationId')
        if (!qaId) throw new GradleException('Supply -PqaApplicationId with a unique QA application ID')
        project.androidComponents.finalizeDsl { android ->
            android.defaultConfig.applicationId = qaId
        }
    }
}
