name: Android CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip debug build for tags - release job handles those
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # Runner images do not guarantee sdkmanager is on PATH. Bootstrap the SDK
    # and accept licenses before installing the pinned native build packages.
    - name: Set up Android SDK tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: ''
        log-accepted-android-sdk-licenses: false

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r28c

    - name: Prepare native dependencies and pinned sources
      run: |
        sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
        python3 tools/prepare_native.py

    - name: Cache sherpa-onnx AAR
      id: cache-aar
      uses: actions/cache@v4
      with:
        path: app/libs/sherpa-onnx-*.aar
        key: ${{ runner.os }}-${{ runner.arch }}-sherpa-ndk28.2.13676358-java21-${{ hashFiles('tools/build_sherpa.py', 'tools/release_artifacts.py', 'tools/sherpa-android/**', 'gradle/wrapper/gradle-wrapper.properties') }}

    - name: Build sherpa-onnx AAR from source
      if: steps.cache-aar.outputs.cache-hit != 'true'
      run: |
        chmod +x build-sherpa-onnx-aar.sh
        ./build-sherpa-onnx-aar.sh
      env:
        ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: ''
        log-accepted-android-sdk-licenses: false

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r28c

    - name: Prepare native dependencies and pinned sources
      run: |
        sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
        python3 tools/prepare_native.py

    - name: Cache sherpa-onnx AAR
      id: cache-aar
      uses: actions/cache@v4
      with:
        path: app/libs/sherpa-onnx-*.aar
        key: ${{ runner.os }}-${{ runner.arch }}-sherpa-ndk28.2.13676358-java21-${{ hashFiles('tools/build_sherpa.py', 'tools/release_artifacts.py', 'tools/sherpa-android/**', 'gradle/wrapper/gradle-wrapper.properties') }}

    - name: Build sherpa-onnx AAR from source
      if: steps.cache-aar.outputs.cache-hit != 'true'
      run: |
        chmod +x build-sherpa-onnx-aar.sh
        ./build-sherpa-onnx-aar.sh
      env:
        ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK and AAB
      run: |
        python3 -m unittest discover -s tools/tests
        ./gradlew testDebugUnitTest assembleRelease bundleRelease --console=plain --quiet

    # Keep tag publishing, but use the same credentials, validation and filenames
    # as the published-release workflow instead of a second signing contract.
    - name: Sign release artifacts
      env:
        UTTERLANE_KEYSTORE_BASE64: ${{ secrets.UTTERLANE_KEYSTORE_BASE64 }}
        UTTERLANE_STORE_PASSWORD: ${{ secrets.UTTERLANE_STORE_PASSWORD }}
        UTTERLANE_KEY_ALIAS: ${{ secrets.UTTERLANE_KEY_ALIAS }}
        UTTERLANE_KEY_PASSWORD: ${{ secrets.UTTERLANE_KEY_PASSWORD }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: python3 tools/sign_release.py --input app/build/outputs --output dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.apk
          dist/*.aab
          dist/SHA256SUMS
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
