name: Build APK

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Install Android build dependencies
        # The Ubuntu runner supplies the SDK tools and accepted SDK licenses.
        # sherpa-onnx compiles against API 34; the app compiles against API 35.
        run: >-
          sdkmanager "platforms;android-34" "platforms;android-35"
          "build-tools;34.0.0" "build-tools;35.0.0"
          "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache sherpa-onnx AAR
        id: sherpa-cache
        uses: actions/cache@v6.1.0
        with:
          path: app/libs/sherpa-onnx-*.aar
          # No fallback keys: native binaries must match the current build inputs.
          key: ${{ runner.os }}-${{ runner.arch }}-sherpa-ndk28.2.13676358-java21-${{ hashFiles('build-sherpa-onnx-aar.sh', 'app/build.gradle.kts') }}

      - name: Build sherpa-onnx AAR
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358" bash build-sherpa-onnx-aar.sh

      - name: Prepare pinned native sources
        run: python3 tools/prepare_native.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: TranSlander-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # APKs are already ZIP archives; compressing them again wastes CPU.
          compression-level: 0

  release:
    name: Attach APK to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Build PR code with read-only access; grant write access only for publishing.
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8.0.1
        with:
          name: TranSlander-debug
          path: apk

      - name: Attach debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # Environment variables keep release tags out of shell source code.
        # Replacing the same asset makes a rerun of this job safe.
        run: |
          mv apk/app-debug.apk apk/TranSlander-debug.apk
          gh release upload "$RELEASE_TAG" apk/TranSlander-debug.apk --clobber
